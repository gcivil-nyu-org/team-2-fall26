<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SemesterPilot{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --nyu-violet: #57068C; }
    html, body { height: 100%; }
    body { margin: 0; }
    .auth-page { min-height: 100vh; }
    .auth-side {
      background: linear-gradient(160deg, var(--nyu-violet), #2d0350);
      color: #fff;
      padding: 3rem;
    }
    .auth-form-side {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .auth-form-box { width: 100%; max-width: 380px; }
    .btn-primary { background-color: var(--nyu-violet); border-color: var(--nyu-violet); }
    .btn-primary:hover { background-color: #44066f; border-color: #44066f; }
  </style>
</head>
<body>
  <div class="row g-0 auth-page">
    <div class="col-lg-6 auth-side d-none d-lg-flex flex-column justify-content-center">
      <h1 class="display-5">SemesterPilot</h1>
      <p class="lead">Keep every course, deadline, and assignment in one place.</p>
    </div>
    <div class="col-lg-6 auth-form-side">
      <div class="auth-form-box">
        {% block form_content %}{% endblock %}
      </div>
    </div>
  </div>
</body>
</html>
