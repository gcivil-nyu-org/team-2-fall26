<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SemesterPilot{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --nyu-violet: #57068C; }
    body { background: #f7f5fa; }
    .navbar-brand { color: var(--nyu-violet) !important; font-weight: 700; }
    .btn-primary { background-color: var(--nyu-violet); border-color: var(--nyu-violet); }
    .btn-primary:hover { background-color: #44066f; border-color: #44066f; }
    .auth-card { max-width: 420px; margin: 4rem auto; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand" href="/">SemesterPilot</a>
      <div class="ms-auto">
        {% if user.is_authenticated %}
          <span class="me-3 text-muted">{{ user.email }}</span>
          <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary btn-sm me-2">Log in</a>
          <a href="{% url 'accounts:signup' %}" class="btn btn-primary btn-sm">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
