<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SemesterPilot{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% include 'includes/styles.html' %}
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <div class="container nav-inner">
      <a class="navbar-brand" href="/">{% include 'includes/mark.html' %}SemesterPilot</a>
      <div class="nav-account">
        {% if user.is_authenticated %}
          <a class="nav-dashboard" href="{% url 'accounts:dashboard' %}">Dashboard</a>
          <span class="account-email">{{ user.email }}</span>
          <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary btn-sm me-2">Log in</a>
          <a href="{% url 'accounts:signup' %}" class="btn btn-primary btn-sm">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container page-content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
